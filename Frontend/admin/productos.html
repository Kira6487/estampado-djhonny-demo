<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex">
    <title>Productos | Administración D'Jhonny</title>
    <link rel="icon" type="image/jpeg" href="../images/djhonny-logo.jpg">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"><link href="../CSS/main.css" rel="stylesheet"><link href="../CSS/responsive.css" rel="stylesheet">
  </head>
  <body data-area="admin" data-admin-page="productos">
    <div class="offcanvas offcanvas-start admin-offcanvas" tabindex="-1" id="adminNavigation" aria-labelledby="adminNavigationLabel"><div class="offcanvas-header"><h1 class="offcanvas-title h5" id="adminNavigationLabel">Administración</h1><button type="button" class="btn-close btn-close-white" data-bs-dismiss="offcanvas" aria-label="Cerrar"></button></div><div class="offcanvas-body p-0" data-admin-nav></div></div>
    <main class="admin-shell"><aside class="admin-sidebar d-none d-lg-block" data-admin-nav></aside><section class="admin-main"><header class="admin-header d-flex justify-content-between align-items-center gap-3"><div class="d-flex align-items-center gap-2"><button class="btn btn-dark d-lg-none" type="button" data-bs-toggle="offcanvas" data-bs-target="#adminNavigation" aria-controls="adminNavigation" aria-label="Abrir menú administrativo"><i class="bi bi-list"></i></button><div><p class="eyebrow mb-1">Administración</p><h1 class="h3 mb-0">Gestión de productos</h1></div></div><div class="d-flex gap-2"><button class="btn btn-outline-secondary btn-sm" type="button" data-admin-logout><i class="bi bi-box-arrow-right me-1"></i>Salir</button></div></header><div class="alert alert-warning mt-4" role="note"><strong>Modo demostración:</strong> no se suben imágenes ni se guarda información en un servidor.</div><div class="content-card"><div class="d-flex flex-wrap justify-content-between gap-3 mb-3"><div><h2 class="h5 mb-1">Catálogo local</h2><p class="small text-secondary mb-0" data-admin-results aria-live="polite"></p></div><div class="d-flex flex-wrap gap-2"><button class="btn btn-outline-secondary" type="button" data-restore-catalog><i class="bi bi-arrow-counterclockwise me-1"></i>Restaurar original</button><button class="btn btn-brand" type="button" data-create-product><i class="bi bi-plus-lg me-1"></i>Crear producto</button></div></div><div class="row g-2 mb-3"><div class="col-lg-5"><label class="visually-hidden" for="admin-search">Buscar</label><div class="input-group"><span class="input-group-text"><i class="bi bi-search"></i></span><input class="form-control" id="admin-search" type="search" placeholder="Buscar por nombre, descripción o slug" data-admin-search></div></div><div class="col-sm-4 col-lg-3"><label class="visually-hidden" for="admin-category">Categoría</label><select class="form-select" id="admin-category" data-admin-category></select></div><div class="col-sm-4 col-lg-2"><label class="visually-hidden" for="admin-state">Estado</label><select class="form-select" id="admin-state" data-admin-state><option value="">Todos los estados</option><option value="Publicado">Publicado</option><option value="Oculto">Oculto</option></select></div><div class="col-sm-4 col-lg-2"><label class="visually-hidden" for="admin-sort">Orden</label><select class="form-select" id="admin-sort" data-admin-sort><option value="nombre">Ordenar: nombre</option><option value="precio">Ordenar: precio</option><option value="modificado">Ordenar: modificación</option></select></div></div><div class="table-responsive"><table class="table table-hover align-middle admin-products-table"><thead><tr><th>Imagen</th><th>Producto</th><th>Categoría</th><th>Desde</th><th>Mínimo</th><th>Estado</th><th>Destacado</th><th>Modificado</th><th>Acciones</th></tr></thead><tbody data-products-table></tbody></table></div><div class="empty-results mt-3" data-admin-empty hidden><i class="bi bi-search display-6 text-success"></i><h2 class="h5 mt-2">Sin resultados</h2><p class="mb-0 text-secondary">Ajusta la búsqueda o los filtros.</p></div><div class="d-flex justify-content-center align-items-center gap-2 mt-3" data-admin-pagination></div></div></section></main>
    <div class="modal fade" id="productModal" tabindex="-1" aria-labelledby="productModalTitle" aria-hidden="true"><div class="modal-dialog modal-xl modal-dialog-scrollable"><div class="modal-content"><div class="modal-header"><h2 class="modal-title fs-5" id="productModalTitle" data-product-modal-title>Producto</h2><button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button></div><div class="modal-body" data-product-form-content></div></div></div></div>
    <div class="modal fade" id="confirmModal" tabindex="-1" aria-labelledby="confirmModalTitle" aria-hidden="true"><div class="modal-dialog modal-dialog-centered"><div class="modal-content"><div class="modal-header"><h2 class="modal-title fs-5" id="confirmModalTitle">Confirmar acción</h2><button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button></div><div class="modal-body" data-confirm-text></div><div class="modal-footer"><button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancelar</button><button type="button" class="btn btn-danger" data-confirm-action>Confirmar</button></div></div></div></div>
    <div class="toast-container position-fixed bottom-0 end-0 p-3" data-admin-toast-zone></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script src="../JS/productos.js"></script><script src="../JS/catalogo-store.js"></script><script src="../JS/admin.js"></script>
  </body>
</html>
